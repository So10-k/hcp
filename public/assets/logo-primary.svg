<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220">
  <title>SideQuest — Primary Logo (Ticket Stub)</title>
  <defs>
    <clipPath id="ticketClip">
      <rect x="20" y="20" width="400" height="160" rx="14"></rect>
    </clipPath>
  </defs>
  
  <g clip-path="url(#ticketClip)">
    <rect x="20" y="20" width="400" height="160" fill="#fffaf0"></rect>
    <rect x="20" y="20" width="110" height="160" fill="#ffd43d"></rect>
  </g>
  <rect x="20" y="20" width="400" height="160" rx="14" fill="none" stroke="#171512" stroke-width="7"></rect>
  
  <line x1="130" y1="20" x2="130" y2="180" stroke="#171512" stroke-width="6" stroke-dasharray="10 10"></line>
  
  <circle cx="130" cy="20" r="13" fill="#f8efd9" stroke="#171512" stroke-width="5"></circle>
  <circle cx="130" cy="180" r="13" fill="#f8efd9" stroke="#171512" stroke-width="5"></circle>
  
  <g transform="translate(75 100) rotate(-90)">
    <text text-anchor="middle" fill="#171512" font-family="Trebuchet MS, Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="5">ADMIT ONE</text>
  </g>
  
  <text x="275" y="116" text-anchor="middle" fill="#171512" font-family="Trebuchet MS, Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="-1">Side<tspan fill="#ff5a3d">Quest</tspan></text>
  
  <text x="275" y="148" text-anchor="middle" fill="#171512" font-family="Trebuchet MS, Arial Rounded MT Bold, Arial, sans-serif" font-weight="900" font-size="12" letter-spacing="3">REAL LIFE · QUEST MODE</text>
</svg>